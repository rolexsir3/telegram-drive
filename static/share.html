<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared files</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4fb;--card:#fff;--ink:#141830;--mut:#6a7196;--line:rgba(20,24,48,.09);--grad:linear-gradient(135deg,#6a7bff,#b36bff 55%,#ff6bb5)}
@media(prefers-color-scheme:dark){:root{--bg:#070a1c;--card:#121631;--ink:#eef0ff;--mut:#8f97c2;--line:rgba(255,255,255,.1)}}
*{box-sizing:border-box}body{margin:0;font:15px Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:-20vmax;z-index:-1;background:radial-gradient(40vmax at 10% 0,#6a7bff33,transparent),radial-gradient(40vmax at 100% 100%,#ff6bb533,transparent)}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:22px clamp(16px,4vw,44px)}
.logo{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:var(--grad);color:#fff;font-size:22px;box-shadow:0 14px 28px -10px #b36bff}
h1{margin:0;font:800 22px Sora,sans-serif;letter-spacing:-.02em}p{margin:2px 0 0;color:var(--mut);font-size:13px}.grow{flex:1}
.btn{padding:11px 20px;border-radius:999px;color:#fff;font-weight:700;text-decoration:none;background:var(--grad);box-shadow:0 14px 28px -12px #b36bff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:0 clamp(16px,4vw,44px) 60px}
.t{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .25s}
.t:hover{transform:translateY(-4px)}.t img{width:100%;height:100%;object-fit:cover;display:block}
.t .n{position:absolute;inset:auto 0 0;padding:26px 10px 8px;background:linear-gradient(transparent,#000b);color:#fff;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .d{position:absolute;top:8px;right:8px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#0007;color:#fff;text-decoration:none}
.t .pl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:#0007;color:#fff}
.ph{display:grid;place-items:center;height:100%;padding:12px;text-align:center;color:var(--mut);word-break:break-all;font-size:13px}
.msg{text-align:center;padding:90px 20px;font:700 20px Sora,sans-serif;color:var(--mut)}
#lb{position:fixed;inset:0;z-index:9;background:rgba(6,8,22,.9);display:grid;place-items:center}#lb[hidden]{display:none}
#lb img,#lb video{max-width:94vw;max-height:90vh;border-radius:16px}#x{position:absolute;top:16px;right:18px;border:0;width:44px;height:44px;border-radius:50%;background:#fff2;color:#fff;font-size:20px;cursor:pointer}
</style>
<header><div class="logo">☁</div><div class="grow"><h1 id="t">Loading…</h1><p id="s"></p></div><a id="z" class="btn" hidden>⬇ Download all (.zip)</a></header>
<div id="g" class="grid"></div>
<div id="lb" hidden><button id="x">✕</button><div id="c"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const base='/s/'+location.pathname.split('/')[2];let list=[];
fetch(base+'/items').then(r=>r.ok?r.json():Promise.reject()).then(d=>{
  list=d.items;$('#t').textContent=d.name;
  const days=d.expires?Math.max(0,Math.ceil((d.expires*1000-Date.now())/864e5)):0;
  $('#s').textContent=`${list.length} file${list.length==1?'':'s'}${d.expires?` · expires in ${days} day${days==1?'':'s'}`:''}`;
  if(list.length>1){$('#z').hidden=false;$('#z').href=base+'/zip'}
  $('#g').innerHTML=list.map((m,i)=>`<div class="t" data-i="${i}">${m.kind=='file'?`<div class="ph">${esc(m.name)}</div>`:`<img loading="lazy" src="${base}/thumb/${m.id}" alt="">`}${m.kind=='video'?'<b class="pl">▶</b>':''}<a class="d" href="${base}/file/${m.id}?dl=1" download title="Download">⬇</a><div class="n">${esc((m.folder?m.folder+' / ':'')+m.name)}</div></div>`).join('')||'<div class="msg">Nothing to show</div>';
}).catch(()=>{$('#t').textContent='This link has expired or does not exist';$('#g').innerHTML='<div class="msg">Ask the sender for a new link.</div>'});
$('#g').onclick=e=>{if(e.target.closest('.d'))return;const t=e.target.closest('[data-i]');if(!t)return;const m=list[+t.dataset.i];
  if(m.kind=='file'){location=`${base}/file/${m.id}?dl=1`;return}
  $('#lb').hidden=false;$('#c').innerHTML=m.kind=='video'?`<video src="${base}/file/${m.id}" controls autoplay></video>`:`<img src="${base}/file/${m.id}" alt="">`};
const cl=()=>{$('#lb').hidden=true;$('#c').innerHTML=''};$('#x').onclick=cl;document.onkeydown=e=>{if(e.key=='Escape')cl()};
</script>
</html>
